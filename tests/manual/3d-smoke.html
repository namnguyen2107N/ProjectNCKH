<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>3D smoke test</title>
  <style>
    body { margin: 0; background: #0b1020; color: #fff; font-family: sans-serif; }
    #canvas-container { position: relative; width: 900px; height: 500px; margin: 20px auto; border-radius: 24px; overflow: hidden; }
    #robot-canvas { display: none; }
    #destination-flag { display: none; }
    #status { text-align: center; font-size: 20px; }
  </style>
</head>
<body>
  <div id="status">loading</div>
  <p style="text-align: center; margin: 8px 0;">
    <a href="../../test-3d.html" style="color: #818cf8; font-weight: bold; text-decoration: underline;">
      🚀 Chuyển sang Môi trường Kiểm thử 3D đầy đủ (Full 3D Test Environment)
    </a>
  </p>
  <div id="canvas-container"></div>
  <canvas id="robot-canvas"></canvas>
  <div id="destination-flag"></div>

  <script src="../../js/kinematics-model.js"></script>
  <script type="module">
    import { Simulation3DEngine } from '../../js/simulation-3d.bundle.js';

    try {
      const engine = new Simulation3DEngine('canvas-container', {
        trackLengthUnits: 50,
        targetDistance: 42,
        unitLabel: 'm',
        timeScale: 1,
      });
      engine.setRobots([{
        id: 'main_bot',
        name: 'Alpha Bot',
        color: '#4f46e5',
        velocity: 7,
        startPosUnits: 0,
        targetUnits: 42,
      }]);
      window.engine = engine;
      document.getElementById('status').textContent = 'ready';
    } catch (error) {
      document.getElementById('status').textContent = 'error: ' + error.message;
      console.error(error);
    }
  </script>
</body>
</html>
